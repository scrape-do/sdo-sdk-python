[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sdo-sdk"
dynamic = ["version"]
description = "Official Python SDK for the Scrape.do web-scraping API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Scrape.do", email = "opensource@scrape.do" }]
keywords = ["scraping", "web-scraping", "scrapedo", "scrape.do", "proxy", "crawler", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    # >=1.2: Decompressor.process(output_buffer_limit=...) bounds brotli output.
    "brotli>=1.2",
]

[project.optional-dependencies]
parse = ["parsel>=1.8"]
# Development tools are pinned with hashes in requirements-dev.txt (compiled
# from requirements-dev.in); see CONTRIBUTING.md.

[project.urls]
Homepage = "https://scrape.do"
Documentation = "https://scrape.do/documentation"
Repository = "https://github.com/scrape-do/sdo-sdk-python"
Issues = "https://github.com/scrape-do/sdo-sdk-python/issues"
Changelog = "https://github.com/scrape-do/sdo-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sdo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sdo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sdo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Ruff 0.16+ also formats Python code blocks in Markdown; the README's examples
# keep their hand-aligned comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/sdo"]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["brotli", "parsel"]
ignore_missing_imports = true
