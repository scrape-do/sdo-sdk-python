# SPDX-License-Identifier: Apache-2.0
# Split build (no id-token) -> minimal publish (OIDC trusted publishing). The
# build job installs only the hash-pinned build chain and runs nothing else
# between `python -m build` and the artifact upload (the tests already ran in
# CI on the same commit, which must be on main). The publish job carries zero
# third-party deps and only downloads the prebuilt artifact, mitigating
# OIDC-token-theft worms.
#
# Two channels, chosen by the tag (trunk-based: every tag is on main):
#   vX.Y.Z-rc.N -> TestPyPI  (environment `prerelease`; _version.py = X.Y.ZrcN)
#   vX.Y.Z      -> PyPI      (environment `release`;    _version.py = X.Y.Z)
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # Forks and mirrors never publish.
    if: github.repository_owner == 'scrape-do'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-ancestry guard needs origin/main and history
          persist-credentials: false
      - name: The tag is on main, names the package version and picks the channel
        id: check
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            channel=test; want="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"   # PEP 440 spelling
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            channel=live; want="${BASH_REMATCH[1]}"
          else
            echo "::error::$tag is neither vX.Y.Z nor vX.Y.Z-rc.N"; exit 1
          fi
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sdo/_version.py)"
          if [ "$version" != "$want" ]; then
            echo "::error::tag $tag needs src/sdo/_version.py = ${want}, found ${version}"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # build, hatchling (+ its dependencies) and twine, every one hash-pinned.
      - run: python -m pip install --require-hashes -r requirements-build.txt
      # --no-isolation: build with the pinned hatchling instead of letting
      # build resolve the backend's dependencies afresh.
      - run: python -m build --no-isolation # sdist + wheel into dist/
      # The same metadata check the publish action runs, so a metadata version
      # it cannot read fails here, before the approval gate.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-test:
    needs: build
    if: needs.build.outputs.channel == 'test'
    runs-on: ubuntu-latest
    environment: prerelease       # approval gate for release candidates
    permissions:
      contents: read
      id-token: write             # OIDC trusted publishing (TestPyPI) — no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    if: needs.build.outputs.channel == 'live'
    runs-on: ubuntu-latest
    environment: release          # require a manual approval gate
    permissions:
      contents: read
      id-token: write             # OIDC trusted publishing — no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  smoke:
    needs: [build, publish-test, publish]
    # Exactly one of the two publish jobs ran; smoke whichever did.
    if: ${{ always() && (needs.publish-test.result == 'success' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Post-publish smoke: install from the public index and import. The index
      # and its CDN can lag the upload, so retry with backoff before failing.
      - name: Install the published version and import it
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          export SDO_EXPECTED_VERSION="${v/-rc./rc}"      # PEP 440 spelling
          index=()
          if [ "$CHANNEL" = test ]; then
            # The candidate comes from TestPyPI; its dependencies from PyPI.
            index=(--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/)
          fi
          for delay in 15 30 60 120 240; do
            if python -m pip install --no-cache-dir "${index[@]}" "sdo-sdk==${SDO_EXPECTED_VERSION}"; then
              python -c "import os, sdo; assert sdo.__version__ == os.environ['SDO_EXPECTED_VERSION'], sdo.__version__; print('installed', sdo.__version__)"
              exit 0
            fi
            echo "sdo-sdk==${SDO_EXPECTED_VERSION} is not installable yet; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::sdo-sdk==${SDO_EXPECTED_VERSION} never became installable"
          exit 1
