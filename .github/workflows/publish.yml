# SPDX-License-Identifier: Apache-2.0
# Split build (no id-token) -> minimal publish (OIDC trusted publishing). The
# build job installs only the hash-pinned build chain and runs nothing else
# between `python -m build` and the artifact upload (the tests already ran in
# CI on the same commit, which must be on main). The publish job carries zero
# third-party deps and only downloads the prebuilt artifact, mitigating
# OIDC-token-theft worms.
#
# Two channels, chosen by the tag (trunk-based: every tag is on main):
#   vX.Y.Z-rc.N -> TestPyPI  (environment `prerelease`; _version.py = X.Y.ZrcN)
#   vX.Y.Z      -> PyPI      (environment `release`;    _version.py = X.Y.Z)
name: publish

on:
  push:
    tags: ["v*"]
  # Manual run: checks the PyPI trusted-publisher token exchange for this
  # workflow without uploading anything (see the publisher-check job).
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # Forks and mirrors never publish; a manual run only checks the publisher.
    if: github.repository_owner == 'scrape-do' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-ancestry guard needs origin/main and history
          persist-credentials: false
      - name: The tag is on main, names the package version and picks the channel
        id: check
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            channel="test"; want="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"   # PEP 440 spelling
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            channel="live"; want="${BASH_REMATCH[1]}"
          else
            echo "::error::$tag is neither vX.Y.Z nor vX.Y.Z-rc.N"; exit 1
          fi
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sdo/_version.py)"
          if [ "$version" != "$want" ]; then
            echo "::error::tag $tag needs src/sdo/_version.py = ${want}, found ${version}"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # build, hatchling (+ its dependencies) and twine, every one hash-pinned.
      - run: python -m pip install --require-hashes -r requirements-build.txt
      # --no-isolation: build with the pinned hatchling instead of letting
      # build resolve the backend's dependencies afresh.
      - run: python -m build --no-isolation # sdist + wheel into dist/
      # The same metadata check the publish action runs, so a metadata version
      # it cannot read fails here, before the approval gate.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      # Notes for the GitHub release: an install line and the version's
      # CHANGELOG section without its heading (a candidate gets none).
      - name: Write the release notes
        if: steps.check.outputs.channel == 'live'
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release-notes"
          # shellcheck disable=SC2016 # the backticks are Markdown, not a substitution
          { printf '```sh\npip install sdo-client==%s\n```\n\n' "$v"
            awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} on && /^(## |\[Unreleased\]:)/ {exit} on' CHANGELOG.md
          } > "$RUNNER_TEMP/release-notes/notes.md"
          if [ "$(grep -c . "$RUNNER_TEMP/release-notes/notes.md")" -le 3 ]; then
            echo "::error::CHANGELOG.md has no '## [$v]' section for the release notes"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.channel == 'live'
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/notes.md

  publish-test:
    needs: build
    if: needs.build.outputs.channel == 'test'
    runs-on: ubuntu-latest
    environment: prerelease       # approval gate for release candidates
    permissions:
      contents: read
      id-token: write             # OIDC trusted publishing (TestPyPI) — no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    if: needs.build.outputs.channel == 'live'
    runs-on: ubuntu-latest
    environment: release          # require a manual approval gate
    permissions:
      contents: read
      id-token: write             # OIDC trusted publishing — no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  smoke:
    needs: [build, publish-test, publish]
    # Exactly one of the two publish jobs ran; smoke whichever did.
    if: ${{ always() && (needs.publish-test.result == 'success' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Post-publish smoke: install from the public index and import. The index
      # and its CDN can lag the upload, so retry with backoff before failing.
      - name: Install the published version and import it
        env:
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          export SDO_EXPECTED_VERSION="${v/-rc./rc}"      # PEP 440 spelling
          index=()
          if [ "$CHANNEL" = test ]; then
            # The candidate comes from TestPyPI; its dependencies from PyPI.
            index=(--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/)
          fi
          for delay in 15 30 60 120 240; do
            # Not hash-pinned on purpose: this installs the version just published,
            # whose hashes exist only on the index, to prove a user's install works.
            if python -m pip install --no-cache-dir "${index[@]}" "sdo-client==${SDO_EXPECTED_VERSION}"; then
              python -c "import os, sdo; assert sdo.__version__ == os.environ['SDO_EXPECTED_VERSION'], sdo.__version__; print('installed', sdo.__version__)"
              exit 0
            fi
            echo "sdo-client==${SDO_EXPECTED_VERSION} is not installable yet; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::sdo-client==${SDO_EXPECTED_VERSION} never became installable"
          exit 1

  # `workflow_dispatch` only: asks PyPI to exchange this job's OIDC token for an
  # upload token, the same exchange the publish action performs, and prints the
  # claims PyPI matches against and its answer. Nothing is uploaded and a
  # minted token is never printed (it expires on its own).
  publisher-check:
    if: github.repository_owner == 'scrape-do' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token with PyPI
        env:
          INDEX_HOST: pypi.org
        run: |
          set -euo pipefail
          audience="$(curl -sSf "https://${INDEX_HOST}/_/oidc/audience" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["audience"])')"
          id_token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$id_token"
          ID_TOKEN="$id_token" python3 - <<'PY'
          import base64, json, os
          payload = os.environ["ID_TOKEN"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for k in ("sub", "repository", "repository_owner", "repository_owner_id", "repository_id",
                    "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name", "aud"):
              print(f"{k}: {json.dumps(claims.get(k))}")
          PY
          body="$(ID_TOKEN="$id_token" python3 -c 'import json, os; print(json.dumps({"token": os.environ["ID_TOKEN"]}))')"
          code="$(curl -sS -o mint.json -w '%{http_code}' -X POST -H "Content-Type: application/json" \
            --data "$body" "https://${INDEX_HOST}/_/oidc/mint-token")"
          echo "exchange with ${INDEX_HOST}: HTTP $code"
          python3 - <<'PY'
          import json
          d = json.load(open("mint.json"))
          if d.get("success"):
              print("The index accepted the token for this workflow (upload token not printed).")
          else:
              print(json.dumps({k: v for k, v in d.items() if k != "token"}, indent=2))
          PY
          rm -f mint.json
          [ "$code" = "200" ]

  # Once a final release installs from PyPI, create the GitHub release for its
  # tag with the notes the build job wrote. Release candidates get none. On the
  # org's self-hosted runners, because the org's IP allow list rejects GitHub
  # API calls from GitHub-hosted runners; it checks out and runs no repository
  # code.
  github-release:
    needs: [build, smoke]
    # always(): smoke's own needs include a skipped publish job.
    if: ${{ always() && needs.build.outputs.channel == 'live' && needs.smoke.result == 'success' }}
    runs-on: self-hosted
    permissions:
      contents: write             # create the GitHub release
    steps:
      # A persistent runner keeps its temp directory between runs.
      - name: Start without old notes
        run: rm -rf "$RUNNER_TEMP/release-notes"
      # The self-hosted runners do not ship the GitHub CLI: install a pinned,
      # checksum-verified release.
      - name: Install gh
        env:
          GH_VERSION: 2.102.0
          GH_SHA256: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::the GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes/notes.md"
