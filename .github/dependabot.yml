# SPDX-License-Identifier: Apache-2.0
# Keeps pip dependencies and SHA-pinned actions current. The cooldown waits for
# a release to age before proposing it, so a compromised release has time to be
# caught and yanked upstream first.
#
# pip is security-only (open-pull-requests-limit: 0 stops version-update
# pull requests; security updates are not limited by it). Dependabot recompiles
# the hash-pinned requirements-{dev,build,audit}.txt files without uv's
# --universal, which drops the platform-specific pins (colorama on Windows) and
# breaks the Windows install. Version bumps are made by hand with the uv
# command in each .in file's header.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      # hatchling is pinned in pyproject.toml [build-system] and in two
      # requirement files; tests/test_api_surface.py fails until they agree.
      build-backend:
        patterns: ["hatchling"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
